<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入口網站</title>
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-title" content="XINBAN 入口">
  <meta name="theme-color" content="#012643">
  <style>
    :root { --navy: #012643; --navy2: #0a3a66; --red: #d2141c; --red2: #a80f16; --bg: #f2f5f9; --ink: #0f1b2d; --muted: #64748b; --line: #e2e8f0; --soft: #eef3f9; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
    button, select { font: inherit; }
    .hdr { position: relative; background: linear-gradient(125deg, var(--navy) 0%, var(--navy) 58%, var(--navy2) 100%); color: #fff; overflow: hidden; }
    .hdr::after { content: ""; position: absolute; right: -60px; top: -20px; bottom: -20px; width: 230px; background: linear-gradient(115deg, transparent 38%, rgba(210,20,28,.9) 39%, rgba(210,20,28,.9) 50%, transparent 51%, transparent 58%, rgba(255,255,255,.12) 59%, rgba(255,255,255,.12) 64%, transparent 65%); pointer-events: none; }
    .hdr-in { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; max-width: 760px; margin: 0 auto; padding: 18px 18px 8px; }
    .logo { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 2px solid #fff; box-shadow: 0 0 0 3px var(--red), 0 6px 16px rgba(0,0,0,.25); object-fit: cover; flex: 0 0 auto; }
    .brand { font-weight: 800; font-size: 19px; letter-spacing: .5px; line-height: 1.25; }
    .tagline { font-size: 11px; letter-spacing: 2.5px; color: #c9d6e6; margin-top: 3px; }
    .ecg { display: block; width: 100%; height: 22px; position: relative; z-index: 1; }
    .ecg polyline { fill: none; stroke: var(--red); stroke-width: 2.2; vector-effect: non-scaling-stroke; }
    main { max-width: 760px; margin: 0 auto; padding: 18px; }
    .back { background: #fff; border: 1px solid var(--line); color: var(--navy); border-radius: 10px; padding: 7px 13px; margin-bottom: 12px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .tile { position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 128px; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: #fff; color: inherit; text-decoration: none; box-shadow: 0 1px 2px rgba(15,27,45,.05), 0 8px 20px rgba(15,27,45,.05); overflow: hidden; }
    .tile::after { content: "›"; position: absolute; right: 14px; bottom: 10px; font-size: 22px; color: #cbd5e1; }
    .tile:active { transform: scale(.98); }
    .tile .ic { width: 44px; height: 44px; border-radius: 14px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .tile .t { font-weight: 800; font-size: 16px; color: var(--navy); }
    .tile .d { font-size: 12.5px; color: var(--muted); padding-right: 14px; }
    .tile.feature { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 14px; background: linear-gradient(120deg, var(--red) 0%, var(--red2) 100%); border: 0; color: #fff; box-shadow: 0 10px 24px rgba(210,20,28,.28); }
    .tile.feature .ic { background: rgba(255,255,255,.18); width: 52px; height: 52px; font-size: 28px; }
    .tile.feature .t { color: #fff; font-size: 18px; }
    .tile.feature .d { color: #fde2e3; }
    .tile.feature::after { color: rgba(255,255,255,.8); top: 50%; bottom: auto; transform: translateY(-50%); font-size: 28px; }
    .sec { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--muted); margin: 20px 2px 10px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .err { color: var(--red); }
    h2.view { margin: 0 0 10px; color: var(--navy); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .controls label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; font-weight: 600; }
    select { padding: 10px 12px; border-radius: 11px; border: 1px solid #cbd5e1; background: #fff; font-size: 16px; min-width: 130px; color: var(--ink); }
    .note { font-size: 13px; color: var(--muted); margin: 6px 0 12px; }
    .tablewrap { overflow: auto; max-height: 70vh; background: #fff; border-radius: 14px; border: 1px solid var(--line); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; text-align: left; }
    th { position: sticky; top: 0; background: var(--navy); color: #fff; font-weight: 600; }
    tbody tr:nth-child(even) td { background: #f8fafc; }
    h3 { font-size: 15px; margin: 22px 0 8px; color: var(--navy); }
    .foot { text-align: center; font-size: 11px; color: #94a3b8; margin: 26px 0 10px; letter-spacing: 1px; }
    #loading { position: fixed; inset: 0; background: rgba(242,245,249,.65); display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 10; color: var(--navy); font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>

      <div><div class="brand" id="brand">入口網站</div><div class="tagline">隊員服務入口 · EMS TEAM</div></div>
    </div>
    <svg class="ecg" viewBox="0 0 600 22" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,11 300,11 312,11 320,2 331,20 341,5 349,11 600,11"/></svg>
  </header>

  <main>
    <section id="vHome">
      <div class="grid" id="grid"></div>
      <div class="foot">資料由分隊幹部維護・如有錯誤請聯絡幹部<br><span id="ver"></span></div>
    </section>

    <section id="vTile" hidden>
      <button class="back" id="backBtn">‹ 返回首頁</button>
      <h2 class="view" id="tTitle"></h2>
      <div class="controls" id="tControls"></div>
      <p class="note" id="tNote"></p>
      <div class="tablewrap" id="tTable"></div>
      <div id="tDetail"></div>
    </section>
  </main>
  <div id="loading" hidden>載入中…</div>

  <script>
    /* ===== 上架設定：只要改這裡 ===== */
    var API_URL = 'PASTE_FRONT_API_URL';   // ← 貼上「入口網站-前台」Apps Script 的部署網址（結尾是 /exec）
    var APP_VERSION = '1.2.1';
    /* ================================= */

    var currentTile = null;
    var currentOpts = {};

    function $(id) { return document.getElementById(id); }
    function el(tag, props, kids) {
      var e = document.createElement(tag);
      props = props || {};
      Object.keys(props).forEach(function (k) {
        if (k === 'text') e.textContent = props[k];
        else if (k === 'cls') e.className = props[k];
        else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
        else e.setAttribute(k, props[k]);
      });
      (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function cleanErr(e) { return String(e && e.message ? e.message : e).replace(/^(Error|Exception|ScriptError)\s*:\s*/i, ''); }
    /** 版本比較：a 比 b 舊就回傳 true（1.2.0 < 1.10.0） */
    function verLt(a, b) {
      var x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
      for (var i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); }
      return false;
    }
    /**
     * 呼叫 Apps Script API：
     * - 放在 GitHub：用 fetch POST 到 API_URL（text/plain，瀏覽器不會送預檢）
     * - 放在 Apps Script 或試用版：用 google.script.run
     */
    function callServer(fn, args) {
      args = args || [];
      if (window.google && google.script && google.script.run) {
        return new Promise(function (resolve, reject) {
          var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          r[fn].apply(r, args);
        });
      }
      if (!/^(https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec|http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\/\S*)$/.test(API_URL)) {
        return Promise.reject(new Error('網站還沒設定 API_URL（請通知管理員）'));
      }
      return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (res) {
          if (!res.ok) throw new Error('伺服器回應錯誤（' + res.status + '）');
          return res.text();
        }, function () { throw new Error('連不上伺服器，請檢查網路後再試'); })
        .then(function (text) {
          var d;
          try { d = JSON.parse(text); } catch (e) { throw new Error('伺服器回應格式不對：請確認 Apps Script 部署的存取權是「所有人」'); }
          if (!d || !d.ok) throw new Error(d && d.error ? d.error : '伺服器錯誤');
          return d.result;
        });
    }
    function run(fn, args) {
      $('loading').hidden = false;
      return callServer(fn, args).then(function (x) { $('loading').hidden = true; return x; },
        function (e) { $('loading').hidden = true; throw new Error(cleanErr(e)); });
    }
    function show(id) {
      ['vHome', 'vTile'].forEach(function (v) { $(v).hidden = (v !== id); });
      window.scrollTo(0, 0);
    }

    /* ---------- 首頁 ---------- */
    function loadHome() {
      run('apiHome', []).then(function (r) {
        $('brand').textContent = r.siteName;
        document.title = r.siteName;
        $('ver').textContent = 'v' + APP_VERSION + (r.apiVersion ? '・API v' + r.apiVersion : '');
        var grid = $('grid');
        grid.innerHTML = '';
        if (!r.tiles.length) grid.appendChild(el('div', { cls: 'empty', text: '目前沒有開放的項目' }));
        r.tiles.forEach(function (t, i) {
          var feature = i === 0 && t.type === '連結';
          var kids = [
            el('div', { cls: 'ic', text: t.icon }),
            el('div', { cls: 't', text: t.title }),
            t.desc ? el('div', { cls: 'd', text: t.desc }) : null,
          ];
          if (t.type === '連結') {
            if (!/^https:\/\//i.test(t.url)) return;
            grid.appendChild(el('a', { cls: 'tile' + (feature ? ' feature' : ''), href: t.url, target: '_blank', rel: 'noopener' }, feature ? [kids[0], el('div', {}, [kids[1], kids[2]])] : kids));
          } else {
            grid.appendChild(el('button', { cls: 'tile', onclick: function () { openTile(t, {}); } }, kids));
          }
        });
        show('vHome');
      }).catch(function (e) {
        $('grid').innerHTML = '';
        $('grid').appendChild(el('div', { cls: 'empty err', text: e.message }));
        show('vHome');
      });
    }

    /* ---------- 報表檢視 ---------- */
    function buildTable(headers, rows) {
      var thead = el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', { text: h }); }))]);
      var tbody = el('tbody', {}, rows.map(function (r) {
        return el('tr', {}, r.map(function (c) { return el('td', { text: c }); }));
      }));
      return el('table', {}, [thead, tbody]);
    }
    function selectBox(label, items, value, onchange) {
      var sel = el('select', { 'aria-label': label });
      items.forEach(function (it) {
        var o = el('option', { value: it.value, text: it.label });
        if (String(it.value) === String(value)) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () { onchange(sel.value); });
      return el('label', {}, [label, sel]);
    }

    function openTile(t, opts) {
      currentTile = t;
      currentOpts = opts;
      run('apiOpenTile', [t.id, opts]).then(function (r) {
        $('tTitle').textContent = t.icon + ' ' + r.title;
        $('tNote').textContent = r.note || '';
        var ctl = $('tControls');
        ctl.innerHTML = '';
        if (r.years && r.years.length) {
          ctl.appendChild(selectBox('年度', r.years, r.year, function (v) {
            openTile(currentTile, { year: v, filter: currentOpts.filter || '' });
          }));
        }
        if (r.filter) {
          var items = [{ value: '', label: '全部' }].concat(r.filter.options.map(function (o) { return { value: o, label: o }; }));
          ctl.appendChild(selectBox(r.filter.label, items, r.filter.value, function (v) {
            openTile(currentTile, { year: currentOpts.year || '', filter: v });
          }));
        }
        var wrap = $('tTable');
        wrap.innerHTML = '';
        if (!r.rows.length) wrap.appendChild(el('div', { cls: 'empty', text: '沒有資料' }));
        else wrap.appendChild(buildTable(r.headers, r.rows));

        var det = $('tDetail');
        det.innerHTML = '';
        if (r.detail && r.detail.rows.length) {
          det.appendChild(el('h3', { text: '明細' }));
          det.appendChild(el('div', { cls: 'tablewrap' }, [buildTable(r.detail.headers, r.detail.rows)]));
        }
        show('vTile');
      }).catch(function (e) {
        show('vTile');
        $('tTitle').textContent = '無法開啟';
        $('tControls').innerHTML = '';
        $('tNote').textContent = '';
        $('tDetail').innerHTML = '';
        $('tTable').innerHTML = '';
        $('tTable').appendChild(el('div', { cls: 'empty err', text: e.message }));
      });
    }

    $('backBtn').addEventListener('click', function () { show('vHome'); });

    $('ver').textContent = 'v' + APP_VERSION;
    loadHome();
  </script>
</body>
</html>
